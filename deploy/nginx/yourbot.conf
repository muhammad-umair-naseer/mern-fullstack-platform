server {
    listen 80;
    server_name yourbot.cortexissolutionhub.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name yourbot.cortexissolutionhub.com;

    ssl_certificate     /etc/ssl/cloudflare/cortexissolutionhub.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/cortexissolutionhub.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Frontend (React / Vite)
    location / {
        proxy_pass https://127.0.0.1:5173;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
