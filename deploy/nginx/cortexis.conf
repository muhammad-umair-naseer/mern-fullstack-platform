# Cortexis, phase 1: main site + admin, behind Cloudflare (orange cloud).
# Installed to /etc/nginx/sites-available/cortexis by deploy/server/04-nginx-site.sh.
#
# TLS: a Cloudflare Origin Certificate (valid for the root domain and
# *.cortexissolutionhub.com), so Cloudflare can run in Full (strict) mode.
# Real visitor IPs: /etc/nginx/conf.d/cloudflare-realip.conf (from
# 03-cloudflare-realip.sh) restores them from CF-Connecting-IP, and only when
# the request really comes from a Cloudflare address.

# --- Port 80: everything goes to HTTPS -----------------------------------
server {
    server_tokens off;
    listen 80;
    listen [::]:80;
    server_name cortexissolutionhub.com www.cortexissolutionhub.com
                admin.cortexissolutionhub.com staging.cortexissolutionhub.com;
    return 301 https://$host$request_uri;
}

# --- Anything not ours (e.g. someone browsing the bare IP) ---------------
server {
    server_tokens off;
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;                      # close the connection, no response
}
server {
    server_tokens off;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;         # refuse TLS for unknown names
}

# --- Shared TLS settings ------------------------------------------------------
ssl_certificate     /etc/ssl/cloudflare/cortexissolutionhub.com.pem;
ssl_certificate_key /etc/ssl/cloudflare/cortexissolutionhub.com.key;
ssl_session_cache   shared:cortexis:10m;
# ssl_protocols (TLS 1.2/1.3) comes from Ubuntu's nginx.conf. server_tokens is
# set there too ("build"), so each server block below turns it off itself.

# --- www -> root ---------------------------------------------------------------
server {
    server_tokens off;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.cortexissolutionhub.com;
    return 301 https://cortexissolutionhub.com$request_uri;
}

# --- The website and its API (one container on 127.0.0.1:5000) -------------
server {
    server_tokens off;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cortexissolutionhub.com;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        # Overwrite, never append: Express trusts exactly this one proxy, and
        # $remote_addr is already the real visitor (restored from Cloudflare).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 35s;
        proxy_hide_header X-Powered-By;
    }
    location ~ /\.(?!well-known) { deny all; }
}

# --- Admin portal (127.0.0.1:6001), behind Cloudflare Access ---------------
# Cloudflare Access asks for the login (one-time PIN to the allowed emails).
# The admin app itself then checks Access's signed token on every request
# (admin/access.js), so reaching this server around Cloudflare gets a 403.
server {
    server_tokens off;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.cortexissolutionhub.com;

    add_header X-Robots-Tag "noindex, nofollow" always;
    location / {
        proxy_pass http://127.0.0.1:6001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# --- staging: reserved for a future separate copy; not the production site ---
server {
    server_tokens off;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.cortexissolutionhub.com;

    add_header X-Robots-Tag "noindex, nofollow" always;
    default_type text/plain;
    return 404 "Staging is not set up yet.\n";
}
