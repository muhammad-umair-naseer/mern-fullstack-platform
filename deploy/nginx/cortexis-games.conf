map $http_upgrade $cortexis_games_connection {
    default upgrade;
    '' close;
}

map $host $cortexis_games_backend {
    default "";
    gotcha.cortexissolutionhub.com    127.0.0.1:3001;
    typedash.cortexissolutionhub.com  127.0.0.1:4001;
    pickparty.cortexissolutionhub.com 127.0.0.1:5001;
    sketch.cortexissolutionhub.com    127.0.0.1:7001;
}

server {
    listen 80;
    listen [::]:80;
    server_tokens off;
    server_name gotcha.cortexissolutionhub.com
                typedash.cortexissolutionhub.com
                pickparty.cortexissolutionhub.com
                sketch.cortexissolutionhub.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_tokens off;
    server_name gotcha.cortexissolutionhub.com
                typedash.cortexissolutionhub.com
                pickparty.cortexissolutionhub.com
                sketch.cortexissolutionhub.com;

    ssl_certificate /etc/ssl/cloudflare/cortexissolutionhub.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/cortexissolutionhub.com.key;

    client_max_body_size 1m;

    location / {
        proxy_pass http://$cortexis_games_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cortexis_games_connection;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
