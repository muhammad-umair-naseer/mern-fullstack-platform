name: Website checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cortexis
          POSTGRES_PASSWORD: ci-synthetic
          POSTGRES_DB: cortexis_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cortexis -d cortexis_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://cortexis:ci-synthetic@127.0.0.1:5432/cortexis_test_ci
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Reject tracked credential files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$'; then exit 1; fi
          if git ls-files | grep -E '\.(pem|key|p12|db|sqlite)$'; then exit 1; fi
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - run: npm audit --prefix server --audit-level=moderate
      - run: npm audit --prefix client --audit-level=moderate
      - run: npm run lint
      - name: API and real Redis integration tests
        run: npm test --prefix server
      - run: npm test --prefix client
      - run: node --test admin/test/*.test.js
      - name: Toolkit checks
        working-directory: client/public/toolkit
        run: |
          npm run check
          npm test
      - name: Verify hosted runner browser
        run: google-chrome --version
      - name: Production frontend including all prerendered routes
        env:
          CHROME_PATH: /usr/bin/google-chrome
          REACT_APP_SITE_URL: ${{ vars.SITE_URL || 'https://ci.example.com' }}
        run: npm run build --prefix client
      - uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: client/build
  image:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: website-build
          path: client/build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
