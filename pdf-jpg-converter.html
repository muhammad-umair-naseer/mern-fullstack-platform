<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF ⇄ JPG — convert on your machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --void:#12151a;
    --panel:#1b1f27;
    --panel-2:#20252e;
    --line:#2b303a;
    --paper:#f6f3ea;
    --paper-line:#e2ddcc;
    --ink:#eae7de;
    --ink-dim:#8d939d;
    --amber:#ffb454;
    --amber-dim:rgba(255,180,84,0.16);
    --success:#6fcf97;
    --danger:#e0716a;
    --font-display:'Space Grotesk',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
    --font-body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--void);color:var(--ink);font-family:var(--font-body);}
  body{min-height:100vh;}
  .app{display:flex;flex-direction:column;min-height:100vh;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 28px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel),var(--void));
    flex-wrap:wrap;gap:12px;
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .mark{
    font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;color:var(--amber);
    border:1px solid var(--amber-dim);background:var(--amber-dim);
    padding:3px 7px;border-radius:4px;text-transform:uppercase;
  }
  .brand h1{font-family:var(--font-display);font-weight:600;font-size:19px;margin:0;letter-spacing:-.01em;}
  .device-note{
    font-family:var(--font-mono);font-size:11.5px;color:var(--ink-dim);
    display:flex;align-items:center;gap:7px;
  }
  .dot-live{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(111,207,151,0.18);}

  /* mode switch */
  .switchbar{display:flex;justify-content:center;padding:18px 20px 6px;}
  .switch{
    position:relative;display:flex;background:var(--panel-2);border:1px solid var(--line);
    border-radius:999px;padding:4px;font-family:var(--font-display);font-weight:600;font-size:13.5px;
  }
  .switch button{
    position:relative;z-index:1;border:none;background:transparent;color:var(--ink-dim);
    padding:9px 20px;border-radius:999px;cursor:pointer;transition:color .2s ease;
    font-family:var(--font-display);font-weight:600;font-size:13.5px;
  }
  .switch button.active{color:#1c1406;}
  .switch .thumb{
    position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);
    background:var(--amber);border-radius:999px;transition:transform .25s cubic-bezier(.4,0,.2,1);
    box-shadow:0 4px 14px rgba(255,180,84,0.35);
  }
  .switch.mode-jpg .thumb{transform:translateX(100%);}

  /* action bar */
  .actionbar{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:14px 28px;border-bottom:1px solid var(--line);background:var(--panel);
  }
  .actionbar .status{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-dim);display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .actionbar .status strong{color:var(--ink);font-weight:600;}
  .qualityctl{display:flex;align-items:center;gap:8px;}
  .qualityctl input[type=range]{accent-color:var(--amber);width:110px;}
  .btnrow{display:flex;gap:9px;flex-wrap:wrap;}

  button.act{
    font-family:var(--font-display);font-weight:600;font-size:13.5px;
    padding:10px 15px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink);cursor:pointer;
    transition:transform .1s ease, border-color .15s ease, filter .15s ease;
  }
  button.act:hover:not(:disabled){border-color:var(--amber);}
  button.act:active:not(:disabled){transform:scale(0.98);}
  button.act:disabled{opacity:.4;cursor:not-allowed;}
  button.act.primary{background:var(--amber);color:#1c1406;border-color:var(--amber);}
  button.act.primary:hover:not(:disabled){filter:brightness(1.06);}
  button.act.ghost{background:transparent;}

  /* stage */
  .stage{flex:1;display:flex;flex-direction:column;min-height:0;}
  .stage-empty{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--ink-dim);gap:14px;padding:40px;text-align:center;
  }
  .dropzone{
    border:1.5px dashed var(--line);border-radius:12px;
    padding:40px 60px;text-align:center;cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .dropzone:hover, .dropzone.drag{border-color:var(--amber);background:var(--amber-dim);}
  .dropzone .dz-title{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--ink);}
  .dropzone .dz-sub{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-dim);margin-top:6px;}
  input[type=file]{display:none;}
  .stage-empty h2{font-family:var(--font-display);color:var(--ink);font-weight:600;font-size:20px;margin:0;}
  .stage-empty p{font-size:13.5px;max-width:420px;line-height:1.55;margin:0;}

  .grid-wrap{flex:1;overflow-y:auto;padding:26px 28px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(160px,1fr));gap:22px;}

  .card{
    position:relative;display:flex;flex-direction:column;gap:8px;
  }
  .frame{
    position:relative;width:100%;aspect-ratio:0.72;border-radius:3px;overflow:hidden;
    background:var(--paper);box-shadow:0 8px 22px rgba(0,0,0,0.35);
  }
  .frame img, .frame canvas{width:100%;height:100%;display:block;object-fit:cover;}
  .card .num{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center;}
  .card .miniact{display:flex;gap:6px;}
  .card .miniact button{
    font-family:var(--font-mono);font-size:10.5px;padding:4px 7px;border-radius:5px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink-dim);cursor:pointer;
  }
  .card .miniact button:hover{border-color:var(--amber);color:var(--ink);}
  .card .miniact button.danger:hover{border-color:var(--danger);color:var(--danger);}

  .add-more-card{
    border:1.5px dashed var(--line);border-radius:3px;aspect-ratio:0.72;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:var(--ink-dim);font-family:var(--font-mono);font-size:11px;text-align:center;
    transition:border-color .15s ease, color .15s ease;
  }
  .add-more-card:hover{border-color:var(--amber);color:var(--amber);}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    font-family:var(--font-mono);font-size:12.5px;padding:10px 16px;border-radius:8px;
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .spinner-overlay{
    position:fixed;inset:0;background:rgba(18,21,26,0.75);backdrop-filter:blur(2px);
    display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:50;
  }
  .spinner-overlay.show{display:flex;}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--amber);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spinner-overlay .label{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-dim);}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <span class="mark">Tool 17</span>
      <h1>PDF ⇄ JPG</h1>
    </div>
    <div class="device-note"><span class="dot-live"></span> runs entirely on this device — nothing is uploaded</div>
  </div>

  <div class="switchbar">
    <div class="switch mode-pdf" id="modeSwitch">
      <div class="thumb"></div>
      <button id="btnPdfMode" class="active">PDF → JPG</button>
      <button id="btnJpgMode">JPG → PDF</button>
    </div>
  </div>

  <div class="actionbar" id="actionbar" style="display:none;">
    <div class="status">
      <span><strong id="countLabel">0</strong> <span id="countUnit">pages</span></span>
      <span class="qualityctl" id="qualityCtl">
        <span>JPEG quality</span>
        <input type="range" min="0.4" max="1" step="0.05" value="0.85" id="qualitySlider">
        <span id="qualityValue">85%</span>
      </span>
    </div>
    <div class="btnrow">
      <button class="act ghost" id="newFileBtn">Start over</button>
      <button class="act primary" id="mainActionBtn" disabled>Convert</button>
    </div>
  </div>

  <div class="stage">
    <div class="stage-empty" id="stageEmpty">
      <div class="dropzone" id="dropzone">
        <div class="dz-title" id="dzTitle">Drop a PDF here</div>
        <div class="dz-sub" id="dzSub">or click to browse · .pdf only</div>
        <input type="file" id="fileInput" accept="application/pdf">
      </div>
      <p id="emptyHint">Each page is rendered to an image and each image is packed into a PDF entirely in your browser — nothing is sent anywhere.</p>
    </div>

    <div class="grid-wrap" id="gridWrap" style="display:none;">
      <div class="grid" id="grid"></div>
    </div>
  </div>
</div>

<div class="spinner-overlay" id="spinnerOverlay">
  <div class="spinner"></div>
  <div class="label" id="spinnerLabel">Working…</div>
</div>

<div class="toast" id="toast"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const { PDFDocument } = PDFLib;

// ---- element refs ----
const modeSwitch = document.getElementById('modeSwitch');
const btnPdfMode = document.getElementById('btnPdfMode');
const btnJpgMode = document.getElementById('btnJpgMode');
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const dzTitle = document.getElementById('dzTitle');
const dzSub = document.getElementById('dzSub');
const emptyHint = document.getElementById('emptyHint');
const stageEmpty = document.getElementById('stageEmpty');
const gridWrap = document.getElementById('gridWrap');
const grid = document.getElementById('grid');
const actionbar = document.getElementById('actionbar');
const countLabel = document.getElementById('countLabel');
const countUnit = document.getElementById('countUnit');
const qualityCtl = document.getElementById('qualityCtl');
const qualitySlider = document.getElementById('qualitySlider');
const qualityValue = document.getElementById('qualityValue');
const newFileBtn = document.getElementById('newFileBtn');
const mainActionBtn = document.getElementById('mainActionBtn');
const toast = document.getElementById('toast');
const spinnerOverlay = document.getElementById('spinnerOverlay');
const spinnerLabel = document.getElementById('spinnerLabel');

let mode = 'pdf2jpg'; // or 'jpg2pdf'
let pdfPages = [];    // [{num, canvas}]
let sourceFileName = 'document';
let images = [];      // [{id, file, dataUrl, width, height}]
let imgIdSeq = 0;

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 2400);
}
function showSpinner(label){ spinnerLabel.textContent = label; spinnerOverlay.classList.add('show'); }
function hideSpinner(){ spinnerOverlay.classList.remove('show'); }

// ---- mode switching ----
function setMode(newMode){
  mode = newMode;
  modeSwitch.classList.toggle('mode-jpg', mode==='jpg2pdf');
  btnPdfMode.classList.toggle('active', mode==='pdf2jpg');
  btnJpgMode.classList.toggle('active', mode==='jpg2pdf');

  if(mode==='pdf2jpg'){
    dzTitle.textContent = 'Drop a PDF here';
    dzSub.textContent = 'or click to browse · .pdf only';
    fileInput.accept = 'application/pdf';
    fileInput.multiple = false;
    emptyHint.textContent = 'Each page is rendered to a JPG image entirely in your browser — nothing is sent anywhere.';
    countUnit.textContent = 'pages';
    qualityCtl.style.display = 'flex';
    mainActionBtn.textContent = 'Download all as ZIP';
  } else {
    dzTitle.textContent = 'Drop JPG / PNG images here';
    dzSub.textContent = 'or click to browse · multiple files OK';
    fileInput.accept = 'image/jpeg,image/png,image/jpg';
    fileInput.multiple = true;
    emptyHint.textContent = 'Each image becomes one PDF page, in the order you add them — built and downloaded entirely in your browser.';
    countUnit.textContent = 'images';
    qualityCtl.style.display = 'none';
    mainActionBtn.textContent = 'Build PDF & download';
  }
  resetToEmpty();
}

btnPdfMode.addEventListener('click', ()=>setMode('pdf2jpg'));
btnJpgMode.addEventListener('click', ()=>setMode('jpg2pdf'));

qualitySlider.addEventListener('input', ()=>{
  qualityValue.textContent = Math.round(qualitySlider.value*100)+'%';
});

// ---- file intake ----
dropzone.addEventListener('click', ()=>fileInput.click());
dropzone.addEventListener('dragover', e=>{e.preventDefault();dropzone.classList.add('drag');});
dropzone.addEventListener('dragleave', ()=>dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e=>{
  e.preventDefault();dropzone.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', e=>{
  handleFiles(e.target.files);
  fileInput.value = '';
});

function handleFiles(fileList){
  const files = [...fileList];
  if(files.length === 0) return;
  if(mode === 'pdf2jpg'){
    handlePdfFile(files[0]);
  } else {
    handleImageFiles(files);
  }
}

// ---- PDF -> JPG ----
async function handlePdfFile(file){
  const looksLikePdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
  if(!looksLikePdf){ showToast("That's not a PDF file"); return; }

  showSpinner('Rendering pages…');
  try{
    const buf = await file.arrayBuffer();
    sourceFileName = file.name.replace(/\.pdf$/i,'') || 'document';
    const pdfDoc = await pdfjsLib.getDocument({data: buf}).promise;

    pdfPages = [];
    grid.innerHTML = '';
    for(let i=1;i<=pdfDoc.numPages;i++){
      const page = await pdfDoc.getPage(i);
      const viewport = page.getViewport({scale: 2});
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
      pdfPages.push({num:i, canvas});
      grid.appendChild(buildPdfPageCard(i, canvas));
    }

    stageEmpty.style.display = 'none';
    gridWrap.style.display = 'block';
    actionbar.style.display = 'flex';
    updateCount();
    mainActionBtn.disabled = pdfPages.length === 0;
    showToast(`Rendered ${pdfPages.length} page${pdfPages.length>1?'s':''}`);
  }catch(err){
    console.error(err);
    showToast('Could not read that PDF — it may be corrupted or password-protected');
    resetToEmpty();
  }finally{
    hideSpinner();
  }
}

function buildPdfPageCard(pageNum, canvas){
  const card = document.createElement('div');
  card.className = 'card';

  const frame = document.createElement('div');
  frame.className = 'frame';
  const thumbCanvas = document.createElement('canvas');
  thumbCanvas.width = canvas.width; thumbCanvas.height = canvas.height;
  thumbCanvas.getContext('2d').drawImage(canvas,0,0);
  frame.appendChild(thumbCanvas);

  const num = document.createElement('div');
  num.className = 'num';
  num.innerHTML = `<span>Page ${pageNum}</span>`;
  const miniact = document.createElement('div');
  miniact.className = 'miniact';
  const dlBtn = document.createElement('button');
  dlBtn.textContent = 'Download';
  dlBtn.addEventListener('click', ()=>downloadSinglePage(pageNum, canvas));
  miniact.appendChild(dlBtn);
  num.appendChild(miniact);

  card.appendChild(frame);
  card.appendChild(num);
  return card;
}

function downloadSinglePage(pageNum, canvas){
  const quality = parseFloat(qualitySlider.value);
  canvas.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${sourceFileName}-page-${pageNum}.jpg`;
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/jpeg', quality);
}

async function downloadAllAsZip(){
  if(pdfPages.length === 0) return;
  mainActionBtn.disabled = true;
  showSpinner('Zipping images…');
  try{
    const zip = new JSZip();
    const quality = parseFloat(qualitySlider.value);
    for(const p of pdfPages){
      const blob = await new Promise(res=>p.canvas.toBlob(res, 'image/jpeg', quality));
      zip.file(`${sourceFileName}-page-${p.num}.jpg`, blob);
    }
    const zipBlob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${sourceFileName}-jpgs.zip`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Downloaded ZIP of all pages');
  }catch(err){
    console.error(err);
    showToast('Something went wrong building the ZIP — please try again');
  }finally{
    hideSpinner();
    mainActionBtn.disabled = pdfPages.length === 0;
  }
}

// ---- JPG -> PDF ----
function handleImageFiles(files){
  const validFiles = files.filter(f=>/^image\/(jpeg|png)$/.test(f.type) || /\.(jpe?g|png)$/i.test(f.name));
  const invalidCount = files.length - validFiles.length;
  if(invalidCount > 0) showToast(`Skipped ${invalidCount} file${invalidCount>1?'s':''} that weren't JPG/PNG`);
  if(validFiles.length === 0) return;

  let pending = validFiles.length;
  validFiles.forEach(file=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        images.push({
          id: imgIdSeq++,
          dataUrl: e.target.result,
          width: img.naturalWidth,
          height: img.naturalHeight
        });
        pending--;
        if(pending === 0) finishImageIntake();
      };
      img.onerror = ()=>{
        pending--;
        showToast(`Couldn't read ${file.name}`);
        if(pending === 0) finishImageIntake();
      };
      img.src = e.target.result;
    };
    reader.onerror = ()=>{
      pending--;
      showToast(`Couldn't read ${file.name}`);
      if(pending === 0) finishImageIntake();
    };
    reader.readAsDataURL(file);
  });
}

function finishImageIntake(){
  stageEmpty.style.display = 'none';
  gridWrap.style.display = 'block';
  actionbar.style.display = 'flex';
  renderImageGrid();
  updateCount();
  mainActionBtn.disabled = images.length === 0;
}

function renderImageGrid(){
  grid.innerHTML = '';
  images.forEach((img, idx)=>{
    grid.appendChild(buildImageCard(img, idx));
  });
  const addMore = document.createElement('div');
  addMore.className = 'add-more-card';
  addMore.textContent = '+ Add more images';
  addMore.addEventListener('click', ()=>fileInput.click());
  grid.appendChild(addMore);
}

function buildImageCard(img, idx){
  const card = document.createElement('div');
  card.className = 'card';

  const frame = document.createElement('div');
  frame.className = 'frame';
  const imageEl = document.createElement('img');
  imageEl.src = img.dataUrl;
  frame.appendChild(imageEl);

  const num = document.createElement('div');
  num.className = 'num';
  num.innerHTML = `<span>${idx+1}</span>`;
  const miniact = document.createElement('div');
  miniact.className = 'miniact';

  const upBtn = document.createElement('button');
  upBtn.textContent = '↑';
  upBtn.disabled = idx === 0;
  upBtn.addEventListener('click', ()=>moveImage(idx, -1));

  const downBtn = document.createElement('button');
  downBtn.textContent = '↓';
  downBtn.disabled = idx === images.length - 1;
  downBtn.addEventListener('click', ()=>moveImage(idx, 1));

  const removeBtn = document.createElement('button');
  removeBtn.textContent = '✕';
  removeBtn.className = 'danger';
  removeBtn.addEventListener('click', ()=>removeImage(idx));

  miniact.appendChild(upBtn);
  miniact.appendChild(downBtn);
  miniact.appendChild(removeBtn);
  num.appendChild(miniact);

  card.appendChild(frame);
  card.appendChild(num);
  return card;
}

function moveImage(idx, delta){
  const target = idx + delta;
  if(target < 0 || target >= images.length) return;
  [images[idx], images[target]] = [images[target], images[idx]];
  renderImageGrid();
}

function removeImage(idx){
  images.splice(idx,1);
  renderImageGrid();
  updateCount();
  mainActionBtn.disabled = images.length === 0;
  if(images.length === 0){
    stageEmpty.style.display = 'flex';
    gridWrap.style.display = 'none';
    actionbar.style.display = 'none';
  }
}

async function buildPdfFromImages(){
  if(images.length === 0) return;
  mainActionBtn.disabled = true;
  showSpinner('Building PDF…');
  try{
    const pdfDoc = await PDFDocument.create();
    for(const img of images){
      const bytes = dataUrlToBytes(img.dataUrl);
      const isPng = img.dataUrl.startsWith('data:image/png');
      const embedded = isPng ? await pdfDoc.embedPng(bytes) : await pdfDoc.embedJpg(bytes);
      // Cap page size so huge photos don't produce an oversized PDF page,
      // while keeping the image's own aspect ratio (1 image px ≈ 1 pt, capped).
      const maxDim = 1000;
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = img.width * scale;
      const h = img.height * scale;
      const page = pdfDoc.addPage([w, h]);
      page.drawImage(embedded, {x:0, y:0, width:w, height:h});
    }
    const outBytes = await pdfDoc.save();
    const blob = new Blob([outBytes], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'images-to-pdf.pdf';
    a.click();
    URL.revokeObjectURL(url);
    showToast(`Built a ${images.length}-page PDF — download started`);
  }catch(err){
    console.error(err);
    showToast('Something went wrong building the PDF — please try again');
  }finally{
    hideSpinner();
    mainActionBtn.disabled = images.length === 0;
  }
}

function dataUrlToBytes(dataUrl){
  const base64 = dataUrl.split(',')[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

// ---- shared ----
function updateCount(){
  countLabel.textContent = mode === 'pdf2jpg' ? pdfPages.length : images.length;
}

mainActionBtn.addEventListener('click', ()=>{
  if(mode === 'pdf2jpg') downloadAllAsZip();
  else buildPdfFromImages();
});

newFileBtn.addEventListener('click', resetToEmpty);

function resetToEmpty(){
  pdfPages = [];
  images = [];
  grid.innerHTML = '';
  gridWrap.style.display = 'none';
  actionbar.style.display = 'none';
  stageEmpty.style.display = 'flex';
  updateCount();
}

setMode('pdf2jpg');
</script>
</body>
</html>
