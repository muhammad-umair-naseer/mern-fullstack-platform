<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Title and description are NOT set here. Every page renders <Seo>, and
         React 19 hoists its title, meta and link tags into this head. A static
         copy here would be appended to rather than replaced, leaving two of
         each, and a crawler reads the first one it finds. -->
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FAF8F4" />
    <!-- The site is light by design. "only light" stops Chrome's automatic dark
         mode from inverting it into a flat dark grey, and darkreader-lock asks
         the Dark Reader extension to leave it alone. -->
    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Instrument Serif sets display type, Geist carries the interface and body,
         Geist Mono the small labels. Poppins is the logo's lettering (navbar lockup) and Space Grotesk
         the footer's company line; the last three families
         belong to the certificate sheet. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Space+Grotesk:wght@500&family=Poppins:wght@600&family=Great+Vibes&family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,600&display=swap"
      rel="stylesheet"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
