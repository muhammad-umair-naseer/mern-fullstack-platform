<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Title and description are NOT set here. Every page renders <Seo>, and
         React 19 hoists its title, meta and link tags into this head. A static
         copy here would be appended to rather than replaced, leaving two of
         each, and a crawler reads the first one it finds. -->
    <meta charset="utf-8" />
    <!-- Content-Security-Policy. Scripts only from this site, so an injected
         tag cannot run. Elsewhere: the API on :5000 in local dev (same origin
         in production), the four games on :3001/:4001/:5001/:7001 of whichever host
         served the page, Google Fonts, and microlink for the web capture
         tools. Images may come from any https host. Inline styles stay allowed
         because React and the prerendered pages write style attributes. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' data: blob: http://*:5000 https://*:5000 http://*:3001 http://*:4001 http://*:5001 http://*:7001 https://api.microlink.io https://*.microlink.io; frame-src 'self' blob: http://*:3001 http://*:4001 http://*:5001 http://*:7001; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'"
    />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png?v=2" />
    <link rel="alternate" type="text/markdown" href="%PUBLIC_URL%/llms.txt" title="LLM Context" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FAF8F4" />
    <!-- The site is light by design. "only light" stops Chrome's automatic dark
         mode from inverting it into a flat dark grey, and darkreader-lock asks
         the Dark Reader extension to leave it alone. -->
    <meta name="color-scheme" content="only light" />
    <meta name="darkreader-lock" />
    <!-- cx-intro:head -->
    <!-- The intro's scripts are files, not inline, so the Content-Security-Policy
         above can keep script-src to 'self'. -->
    <script src="%PUBLIC_URL%/cx-intro-head.js" data-home="%PUBLIC_URL%/"></script>
    <style>
      /* Self-contained: this paints before the site's own CSS exists, so it
         carries its own palette and motion values (motion-craft tokens). */
      :root {
        --cxi-ivory: #FAF8F4;
        --cxi-ink-2: #3D3833;
        --cxi-fast: 150ms;
        --cxi-base: 220ms;
        --cxi-slow: 340ms;
        --cxi-hero: 700ms;
        --cxi-draw: 1100ms;
        --cxi-out-expo: cubic-bezier(0.16, 1, 0.30, 1);
        --cxi-out-quint: cubic-bezier(0.22, 1, 0.36, 1);
        --cxi-in-out: cubic-bezier(0.76, 0, 0.24, 1);
        --cxi-in: cubic-bezier(0.55, 0, 1, 0.45);
        --cxi-snap: cubic-bezier(0.34, 1.42, 0.64, 1);
      }
      .cxi { display: none; }
      html.intro .cxi { display: block; position: fixed; inset: 0; z-index: 10000; }
      .cxi-bg { position: absolute; inset: 0; background: var(--cxi-ivory); }
      .cxi-stage { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
      .cxi-lockup { display: flex; flex-direction: column; align-items: center; gap: 22px; transform: translate3d(0, -4vh, 0); }
      .cxi-mark { position: relative; width: 180px; aspect-ratio: 222 / 212; transform-origin: 0 0; }
      .cxi-mark svg, .cxi-mark img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .cxi-mark svg { overflow: visible; }
      .cxi-mark img { object-fit: contain; opacity: 0; }
      .cxi-word { position: relative; width: 250px; overflow: hidden; transform-origin: 0 0; }
      .cxi-word svg { display: block; width: 100%; height: auto; }
      .cxi-cover { position: absolute; left: 0; right: 0; background: var(--cxi-ivory); }
      .cxi-cover-1 { top: 0; height: 64%; }
      .cxi-cover-2 { top: 64%; bottom: 0; }
      .cxi-skip {
        position: absolute; top: max(1rem, env(safe-area-inset-top)); right: clamp(1rem, 4vw, 3rem);
        min-height: 44px; padding: 0.55rem 1.1rem;
        border: 1px solid rgba(22, 19, 15, 0.45); border-radius: 999px;
        background: transparent; color: var(--cxi-ink-2);
        font: 500 0.9rem/1 "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        cursor: pointer;
        transition: background-color var(--cxi-fast) var(--cxi-out-expo);
      }
      .cxi-skip:hover, .cxi-skip:focus-visible { background: #F2EDE4; }
      .cxi-skip:focus-visible { outline: 2px solid #1C488C; outline-offset: 3px; }
      @media (max-width: 480px) {
        .cxi-mark { width: 132px; }
        .cxi-word { width: 184px; }
        .cxi-lockup { gap: 16px; }
      }

      @keyframes cxi-draw { to { stroke-dashoffset: 0; } }
      @keyframes cxi-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes cxi-out { to { opacity: 0; } }
      @keyframes cxi-pop { from { transform: scale(0.6); } to { transform: none; } }
      @keyframes cxi-wipe { to { transform: translate3d(102%, 0, 0); } }
      @keyframes cxi-fly { to { transform: translate(var(--fx), var(--fy)) scale(var(--fs)); } }

      /* The draw-on, on one clock from the first paint (ms):
           0  frame draws (1100)       190  hemispheres (1100)
         640  stand   770-990  circuit traces, nodes light as each lands
        1570  the orange hub lands (the one overshoot)
        1600  the real logo fades over the drawing
        1450  CORTEXIS wipes in, 1850 the second line (ends ~2550)
        then a 650ms hold on the finished lockup, then it flies to the
        navbar (700) as the page arrives: about 4 seconds in all. */
      html.intro .cxi-draw {
        stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: cxi-draw var(--d, var(--cxi-hero)) var(--e, var(--cxi-in-out)) var(--t, 0ms) both;
      }
      html.intro .cxi-node {
        opacity: 0; transform-box: fill-box; transform-origin: center;
        animation: cxi-pop var(--cxi-slow) var(--cxi-out-expo) var(--t) both, cxi-in var(--cxi-slow) var(--cxi-out-expo) var(--t) both;
      }
      html.intro .cxi-hub { animation-timing-function: var(--cxi-snap), var(--cxi-out-expo); }
      html.intro .cxi-strokes { animation: cxi-out var(--cxi-slow) var(--cxi-in) 1600ms both; }
      html.intro .cxi-mark img { animation: cxi-in var(--cxi-hero) var(--cxi-out-quint) 1600ms both; }
      html.intro .cxi-cover-1 { animation: cxi-wipe var(--cxi-draw) var(--cxi-out-expo) 1450ms both; }
      html.intro .cxi-cover-2 { animation: cxi-wipe var(--cxi-hero) var(--cxi-out-quint) 1850ms both; }

      html.intro-go .cxi-bg { animation: cxi-out var(--cxi-slow) var(--cxi-in) both; }
      html.intro-go .cxi-mark, html.intro-go .cxi-word { animation: cxi-fly var(--cxi-hero) var(--cxi-in-out) both; }
      html.intro-docked .cxi-stage { animation: cxi-out var(--cxi-base) linear both; }
      html.intro-bail .cxi { animation: cxi-out var(--cxi-base) var(--cxi-in) both; }

      /* The page behind: the home hero waits for the lockup to leave, and
         the navbar's own logo stays hidden until the flying one lands on it. */
      html.intro:not(.intro-go) .lx-hero,
      html.intro:not(.intro-go) .lx-hero * { animation-play-state: paused !important; }
      html.intro:not(.intro-docked) .navbar .nav-logo { opacity: 0 !important; }
      html.intro-docked .navbar .nav-logo { animation: cxi-in var(--cxi-base) linear both !important; }

      /* Reduced motion: no intro, the first view arrives in one 140ms fade. */
      html.intro-reduced #root { animation: cxi-in 140ms linear both !important; }
    </style>
    <!-- /cx-intro:head -->
