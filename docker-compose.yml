services:
  cortexis-website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cortexis-website
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgres://cortexis:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/cortexis
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env to a long random value}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - CONTACT_TO=${CONTACT_TO:-}
      - ADMIN_ALERT_TO=${ADMIN_ALERT_TO:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      - GAME_SSO_SECRET=${GAME_SSO_SECRET:?set GAME_SSO_SECRET in .env to a long random value}
      - EMBEDDED_WORKER=${EMBEDDED_WORKER:-true}
      # the admin portal's Games section reads players from each game over the internal network
      - GOTCHA_URL=http://gotcha-rush:3000
      - TYPEDASH_URL=http://typedash:4000
      - PICKPARTY_URL=http://pickparty:3000
    networks:
      - cortexis_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cortexis-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cortexis-worker
    restart: unless-stopped
    command: ["node", "src/workers/email.worker.js"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://cortexis:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/cortexis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - CONTACT_TO=${CONTACT_TO:-}
      - ADMIN_ALERT_TO=${ADMIN_ALERT_TO:-}
    networks:
      - cortexis_internal
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    profiles:
      - worker

  gotcha-rush:
    build:
      context: ./games/gotcha-rush
      dockerfile: Dockerfile
    container_name: cortexis-gotcha-rush
    restart: unless-stopped
    ports:
      - "${GOTCHA_PORT:-3001}:3000"
    environment:
      - PORT=3000
      - DATA_FILE=/data/gotcharush.json
      - RUNNER=off
      - NODE_ENV=production
      - GAME_SSO_SECRET=${GAME_SSO_SECRET:?set GAME_SSO_SECRET in .env to a long random value}
      - CORTEXIS_SITE_URL=${CORTEXIS_SITE_URL:-}
      - CORTEXIS_API_URL=${CORTEXIS_API_URL:-}
      - CORTEXIS_PARENT_ORIGINS=${CORTEXIS_PARENT_ORIGINS:-}
    volumes:
      - cortexis_gotcha_data:/data
    networks:
      - cortexis_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

  typedash:
    build:
      context: ./games/typedash
      dockerfile: Dockerfile
    container_name: cortexis-typedash
    restart: unless-stopped
    ports:
      - "${TYPEDASH_PORT:-4001}:4000"
    environment:
      - PORT=4000
      - DATA_FILE=/data/typedash.json
      - NODE_ENV=production
      - GAME_SSO_SECRET=${GAME_SSO_SECRET:?set GAME_SSO_SECRET in .env to a long random value}
      - CORTEXIS_SITE_URL=${CORTEXIS_SITE_URL:-}
      - CORTEXIS_API_URL=${CORTEXIS_API_URL:-}
      - CORTEXIS_PARENT_ORIGINS=${CORTEXIS_PARENT_ORIGINS:-}
    volumes:
      - cortexis_typedash_data:/data
    networks:
      - cortexis_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

  pickparty:
    build:
      context: ./games/pickparty
      dockerfile: Dockerfile
    container_name: cortexis-pickparty
    restart: unless-stopped
    ports:
      - "${PICKPARTY_PORT:-5001}:3000"
    environment:
      - PORT=3000
      - DATA_FILE=/data/pickparty.json
      - NODE_ENV=production
      - GAME_SSO_SECRET=${GAME_SSO_SECRET:?set GAME_SSO_SECRET in .env to a long random value}
      - CORTEXIS_SITE_URL=${CORTEXIS_SITE_URL:-}
      - CORTEXIS_API_URL=${CORTEXIS_API_URL:-}
      - CORTEXIS_PARENT_ORIGINS=${CORTEXIS_PARENT_ORIGINS:-}
    volumes:
      - cortexis_pickparty_data:/data
    networks:
      - cortexis_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: cortexis-admin
    restart: unless-stopped
    ports:
      # staff only: keep this port behind a firewall or VPN in production
      - "${ADMIN_PORT:-6001}:3000"
    environment:
      - PORT=3000
      - ADMIN_API_URL=${ADMIN_API_URL:-}
      - ADMIN_SITE_URL=${ADMIN_SITE_URL:-}
    networks:
      - cortexis_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: cortexis-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=cortexis
      - POSTGRES_USER=cortexis
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Security: No public ports exposed to host. Only accessible within the internal docker network.
    volumes:
      - cortexis_pg_data:/var/lib/postgresql/data
    networks:
      - cortexis_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortexis -d cortexis"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cortexis-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env} --maxmemory 256mb --maxmemory-policy volatile-lru
    # Security: No public ports exposed to host. Only accessible within the internal docker network.
    volumes:
      - cortexis_redis_data:/data
    networks:
      - cortexis_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  cortexis_internal:
    driver: bridge

volumes:
  cortexis_pg_data:
    driver: local
  cortexis_redis_data:
    driver: local
  cortexis_gotcha_data:
    driver: local
  cortexis_typedash_data:
    driver: local
  cortexis_pickparty_data:
    driver: local



