services:
  cortexis-website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cortexis-website
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgres://cortexis:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/cortexis
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (64+ random hex characters)}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - CONTACT_TO=${CONTACT_TO:-}
      - ADMIN_ALERT_TO=${ADMIN_ALERT_TO:-}
    networks:
      - cortexis_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: cortexis-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=cortexis
      - POSTGRES_USER=cortexis
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Security: No public ports exposed to host. Only accessible within the internal docker network.
    volumes:
      - cortexis_pg_data:/var/lib/postgresql/data
    networks:
      - cortexis_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortexis -d cortexis"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cortexis-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env} --maxmemory 256mb --maxmemory-policy volatile-lru
    # Security: No public ports exposed to host. Only accessible within the internal docker network.
    volumes:
      - cortexis_redis_data:/data
    networks:
      - cortexis_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  cortexis_internal:
    driver: bridge

volumes:
  cortexis_pg_data:
    driver: local
  cortexis_redis_data:
    driver: local

